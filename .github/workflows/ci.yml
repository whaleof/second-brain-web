name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 后端：pytest（sync_core 同步合并逻辑 25 测试）----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run backend tests
        run: python -m pytest tests/ -q

      # ---- 前端：node --test（db_schema 写入校验 10 测试）----
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run frontend tests
        run: node --test tests/test_db_schema.test.mjs
